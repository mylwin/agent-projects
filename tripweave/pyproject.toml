[project]
name = "tripweave"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "mylwin", email = "2232802210@qq.com" }
]
requires-python = ">=3.13.15"
dependencies = [
    "httpx>=0.28,<1",
    "langchain>=1.4.8",
    "langchain-openai>=1,<2",
    "pydantic>=2.14.2,<3",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
# 中文注释与提示语按字符数计算长度，强制折行反而更难读，不检查行宽。
ignore = ["E501"]
